spring:
  application:
    name: places-service
  datasource:
    url: ${PLACES_DB_URL:jdbc:postgresql://localhost:15435/owoke_places}
    username: ${PLACES_DB_USERNAME:owoke_places}
    password: ${PLACES_DB_PASSWORD:owoke_places}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:dating-redis}
      database: ${PLACES_REDIS_DATABASE:2}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PLACES_SERVICE_PORT:8084}

owoke:
  security:
    issuer: ${OWOKE_JWT_ISSUER:http://localhost:8081}
    audience: ${OWOKE_JWT_AUDIENCE:owoke-api}
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  two-gis:
    enabled: ${TWO_GIS_ENABLED:false}
    api-key: ${TWO_GIS_API_KEY:}
    base-url: https://catalog.api.2gis.com
    location: 49.1064,55.7963
    radius-meters: 40000
    page-size: 50
    requests-per-second: 2
    queries:
      - "\u043a\u0430\u0444\u0435"
      - "\u0440\u0435\u0441\u0442\u043e\u0440\u0430\u043d"
      - "\u0440\u0430\u0437\u0432\u043b\u0435\u0447\u0435\u043d\u0438\u044f"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
