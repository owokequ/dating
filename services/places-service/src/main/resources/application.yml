spring:
  application:
    name: places-service
  datasource:
    url: ${PLACES_DB_URL:jdbc:postgresql://localhost:15435/owoke_places}
    username: ${PLACES_DB_USERNAME:owoke_places}
    password: ${PLACES_DB_PASSWORD:owoke_places}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:dating-redis}
      database: ${PLACES_REDIS_DATABASE:2}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: places-service-media-projection
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PLACES_SERVICE_PORT:8084}

owoke:
  security:
    issuer: ${OWOKE_JWT_ISSUER:http://localhost:8081}
    audience: ${OWOKE_JWT_AUDIENCE:owoke-api}
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  two-gis:
    enabled: ${TWO_GIS_ENABLED:false}
    schedule-enabled: ${TWO_GIS_SCHEDULE_ENABLED:false}
    api-key: ${TWO_GIS_API_KEY:}
    base-url: https://catalog.api.2gis.com
    point: 49.1064,55.7963
    radius-meters: 40000
    page-size: ${TWO_GIS_PAGE_SIZE:10}
    max-pages: ${TWO_GIS_MAX_PAGES:1}
    requests-per-second: 2
    queries:
      - query: "\u043a\u0430\u0444\u0435"
        category: CAFE
      - query: "\u0440\u0435\u0441\u0442\u043e\u0440\u0430\u043d\u044b"
        category: RESTAURANT
      - query: "\u0440\u0430\u0437\u0432\u043b\u0435\u0447\u0435\u043d\u0438\u044f"
        category: ENTERTAINMENT
  kudago:
    enabled: ${KUDAGO_PLACES_ENABLED:true}
    base-url: ${KUDAGO_BASE_URL:https://kudago.com}
    location: kzn
    page-size: ${KUDAGO_PLACES_PAGE_SIZE:100}
    food-limit: ${KUDAGO_PLACES_FOOD_LIMIT:10}
    leisure-limit: ${KUDAGO_PLACES_LEISURE_LIMIT:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
