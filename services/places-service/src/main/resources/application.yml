spring:
  application:
    name: places-service
  datasource:
    url: ${PLACES_DB_URL:jdbc:postgresql://localhost:15435/owoke_places}
    username: ${PLACES_DB_USERNAME:owoke_places}
    password: ${PLACES_DB_PASSWORD:owoke_places}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PLACES_SERVICE_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
