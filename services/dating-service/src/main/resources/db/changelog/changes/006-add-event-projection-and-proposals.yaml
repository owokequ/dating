databaseChangeLog:
  - changeSet:
      id: 006-add-event-projection-and-proposals
      author: codex
      changes:
        - modifyDataType:
            tableName: date_proposals
            columnName: place_name_snapshot
            newDataType: varchar(300)
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE event_projections (
                  id UUID PRIMARY KEY,
                  title VARCHAR(300) NOT NULL,
                  description VARCHAR(4000),
                  price_text VARCHAR(500),
                  source_page_url VARCHAR(1000) NOT NULL,
                  venue_name VARCHAR(300),
                  venue_address VARCHAR(500),
                  latitude DOUBLE PRECISION,
                  longitude DOUBLE PRECISION,
                  local_place_id UUID,
                  cover_media_id UUID,
                  media_version BIGINT NOT NULL DEFAULT 0,
                  status VARCHAR(32) NOT NULL,
                  updated_at TIMESTAMPTZ NOT NULL,
                  version BIGINT NOT NULL DEFAULT 0,
                  CONSTRAINT ck_event_projection_status CHECK(status IN ('DRAFT','ACTIVE','HIDDEN','ARCHIVED'))
              );
              CREATE TABLE event_occurrence_projections (
                  id UUID PRIMARY KEY,
                  event_id UUID NOT NULL REFERENCES event_projections(id) ON DELETE CASCADE,
                  starts_at TIMESTAMPTZ NOT NULL,
                  ends_at TIMESTAMPTZ,
                  continuous BOOLEAN NOT NULL,
                  status VARCHAR(32) NOT NULL,
                  updated_at TIMESTAMPTZ NOT NULL,
                  CONSTRAINT ck_event_occurrence_projection_status CHECK(status IN ('ACTIVE','EXPIRED')),
                  CONSTRAINT ck_event_occurrence_projection_range CHECK(ends_at IS NULL OR ends_at >= starts_at)
              );
              CREATE INDEX idx_event_occurrence_projection_event ON event_occurrence_projections(event_id, starts_at);

              ALTER TABLE date_proposals ALTER COLUMN place_id DROP NOT NULL;
              ALTER TABLE date_proposals ADD COLUMN selection_type VARCHAR(16) NOT NULL DEFAULT 'PLACE';
              ALTER TABLE date_proposals ADD COLUMN event_id UUID;
              ALTER TABLE date_proposals ADD COLUMN event_occurrence_id UUID;
              ALTER TABLE date_proposals ADD COLUMN event_title_snapshot VARCHAR(300);
              ALTER TABLE date_proposals ADD COLUMN event_source_url_snapshot VARCHAR(1000);
              ALTER TABLE date_proposals ADD COLUMN event_price_snapshot VARCHAR(500);
              ALTER TABLE date_proposals ADD CONSTRAINT ck_date_proposal_selection
                  CHECK ((selection_type = 'PLACE' AND place_id IS NOT NULL AND event_id IS NULL AND event_occurrence_id IS NULL)
                      OR (selection_type = 'EVENT' AND event_id IS NOT NULL AND event_occurrence_id IS NOT NULL));
