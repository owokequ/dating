databaseChangeLog:
  - changeSet:
      id: 001-create-couple-schema
      author: codex
      changes:
        - createTable:
            tableName: couples
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: created_by, type: uuid, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: activated_at, type: timestamp with time zone }
              - column: { name: closed_at, type: timestamp with time zone }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - createTable:
            tableName: couple_members
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: couple_id, type: uuid, constraints: { nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: role, type: varchar(32), constraints: { nullable: false } }
              - column: { name: joined_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: left_at, type: timestamp with time zone }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: couple_members
            baseColumnNames: couple_id
            constraintName: fk_couple_members_couple
            referencedTableName: couples
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            tableName: couple_members
            indexName: idx_couple_members_couple
            columns:
              - column: { name: couple_id }
        - createTable:
            tableName: couple_invitations
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: couple_id, type: uuid, constraints: { nullable: false } }
              - column: { name: inviter_id, type: uuid, constraints: { nullable: false } }
              - column: { name: token_hash, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: accepted_at, type: timestamp with time zone }
              - column: { name: revoked_at, type: timestamp with time zone }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: couple_invitations
            baseColumnNames: couple_id
            constraintName: fk_couple_invitations_couple
            referencedTableName: couples
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            tableName: couple_invitations
            indexName: idx_couple_invitations_couple
            columns:
              - column: { name: couple_id }
        - createTable:
            tableName: outbox_events
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: topic, type: varchar(128), constraints: { nullable: false } }
              - column: { name: event_key, type: varchar(128), constraints: { nullable: false } }
              - column: { name: event_type, type: varchar(128), constraints: { nullable: false } }
              - column: { name: payload, type: jsonb, constraints: { nullable: false } }
              - column: { name: occurred_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: published_at, type: timestamp with time zone }
              - column: { name: attempts, type: integer, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: next_attempt_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: last_error, type: varchar(1000) }
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_pending
            columns:
              - column: { name: next_attempt_at }
              - column: { name: occurred_at }
        - sql:
            dbms: postgresql
            sql: >-
              CREATE UNIQUE INDEX uq_couple_members_active_user
              ON couple_members (user_id) WHERE left_at IS NULL;
        - sql:
            dbms: postgresql
            sql: >-
              CREATE UNIQUE INDEX uq_couple_members_active_role
              ON couple_members (couple_id, role) WHERE left_at IS NULL;
        - sql:
            dbms: postgresql
            sql: >-
              CREATE UNIQUE INDEX uq_couple_invitations_pending
              ON couple_invitations (couple_id) WHERE status = 'PENDING';
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE couples ADD CONSTRAINT chk_couples_status
              CHECK (status IN ('PENDING', 'ACTIVE', 'CLOSED'));
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE couple_members ADD CONSTRAINT chk_couple_members_role
              CHECK (role IN ('OWNER', 'PARTNER'));
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE couple_invitations ADD CONSTRAINT chk_couple_invitations_status
              CHECK (status IN ('PENDING', 'ACCEPTED', 'REVOKED'));
