spring:
  application:
    name: dating-service
  datasource:
    url: ${DATING_DB_URL:jdbc:postgresql://localhost:15433/owoke_dating}
    username: ${DATING_DB_USERNAME:owoke_dating}
    password: ${DATING_DB_PASSWORD:owoke_dating}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dating-service-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${DATING_SERVICE_PORT:8082}

owoke:
  messaging:
    consumers-enabled: ${DATING_KAFKA_CONSUMERS_ENABLED:true}
  security:
    issuer: ${OWOKE_JWT_ISSUER:http://localhost:8081}
    audience: ${OWOKE_JWT_AUDIENCE:owoke-api}
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  web-app-url: ${WEB_APP_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
