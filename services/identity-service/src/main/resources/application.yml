spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:15432/owoke_identity}
    username: ${IDENTITY_DB_USERNAME:owoke_identity}
    password: ${IDENTITY_DB_PASSWORD:owoke_identity}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:dating-redis}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: identity-service-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${IDENTITY_SERVICE_PORT:8081}

owoke:
  security:
    issuer: ${OWOKE_JWT_ISSUER:http://localhost:8081}
    audience: ${OWOKE_JWT_AUDIENCE:owoke-api}
    key-id: ${OWOKE_JWT_KEY_ID:owoke-local-1}
    private-key-base64: ${OWOKE_JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${OWOKE_JWT_PUBLIC_KEY_BASE64:}
    access-token-ttl: ${OWOKE_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${OWOKE_REFRESH_TOKEN_TTL:30d}
    cookie-secure: ${COOKIE_SECURE:false}
    web-app-url: ${WEB_APP_URL:http://localhost:5173}
  telegram:
    oidc:
      client-id: ${TELEGRAM_OIDC_CLIENT_ID:}
      client-secret: ${TELEGRAM_OIDC_CLIENT_SECRET:}
      bot-username: ${TELEGRAM_BOT_USERNAME:}
      redirect-uri: ${TELEGRAM_OIDC_REDIRECT_URI:http://localhost:8080/api/v1/auth/telegram/callback}
      mobile-redirect-uri: ${TELEGRAM_OIDC_MOBILE_REDIRECT_URI:formyl://auth/telegram}
      authorization-uri: https://oauth.telegram.org/auth
      token-uri: https://oauth.telegram.org/token
      jwk-set-uri: https://oauth.telegram.org/.well-known/jwks.json
      issuer: https://oauth.telegram.org
      state-ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
