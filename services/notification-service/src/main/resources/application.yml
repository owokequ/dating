spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:15434/owoke_notification}
    username: ${NOTIFICATION_DB_USERNAME:owoke_notification}
    password: ${NOTIFICATION_DB_PASSWORD:owoke_notification}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:dating-redis}
      database: ${NOTIFICATION_REDIS_DATABASE:1}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${NOTIFICATION_SERVICE_PORT:8083}

owoke:
  security:
    issuer: ${OWOKE_JWT_ISSUER:http://localhost:8081}
    audience: ${OWOKE_JWT_AUDIENCE:owoke-api}
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  notification:
    web-app-url: ${WEB_APP_URL:http://localhost:5173}
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@owoke.local}
    media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8085}
    delivery-fixed-delay: ${NOTIFICATION_DELIVERY_FIXED_DELAY:1000}
  site-availability:
    enabled: ${SITE_AVAILABILITY_ENABLED:false}
    webhook-secret: ${SITE_AVAILABILITY_WEBHOOK_SECRET:}
    frontend-monitor-id: ${SITE_AVAILABILITY_FRONTEND_MONITOR_ID:}
    api-monitor-id: ${SITE_AVAILABILITY_API_MONITOR_ID:}
  telegram:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    mode: ${TELEGRAM_BOT_MODE:webhook}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
