databaseChangeLog:
  - changeSet:
      id: 001-create-notification-schema
      author: codex
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE contact_projections (
                  user_id UUID PRIMARY KEY,
                  email VARCHAR(320),
                  display_name VARCHAR(120) NOT NULL,
                  telegram_user_id BIGINT,
                  telegram_chat_id BIGINT,
                  telegram_username VARCHAR(64),
                  bot_access BOOLEAN NOT NULL DEFAULT FALSE,
                  updated_at TIMESTAMPTZ NOT NULL,
                  version BIGINT NOT NULL DEFAULT 0,
                  CONSTRAINT uk_contact_telegram_user UNIQUE (telegram_user_id)
              );

              CREATE TABLE notification_preferences (
                  user_id UUID PRIMARY KEY REFERENCES contact_projections(user_id),
                  in_app_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                  telegram_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                  email_enabled BOOLEAN NOT NULL DEFAULT TRUE,
                  updated_at TIMESTAMPTZ NOT NULL,
                  version BIGINT NOT NULL DEFAULT 0
              );

              CREATE TABLE notifications (
                  id UUID PRIMARY KEY,
                  user_id UUID NOT NULL REFERENCES contact_projections(user_id),
                  source_event_id UUID NOT NULL,
                  type VARCHAR(64) NOT NULL,
                  title VARCHAR(160) NOT NULL,
                  body VARCHAR(2000) NOT NULL,
                  action_url VARCHAR(1000),
                  read_at TIMESTAMPTZ,
                  created_at TIMESTAMPTZ NOT NULL,
                  CONSTRAINT uk_notification_event_recipient UNIQUE (source_event_id, user_id, type)
              );
              CREATE INDEX idx_notifications_user_created
                  ON notifications(user_id, created_at DESC);

              CREATE TABLE delivery_attempts (
                  id UUID PRIMARY KEY,
                  notification_id UUID NOT NULL REFERENCES notifications(id),
                  channel VARCHAR(16) NOT NULL,
                  status VARCHAR(16) NOT NULL,
                  attempt_count INTEGER NOT NULL DEFAULT 0,
                  next_attempt_at TIMESTAMPTZ NOT NULL,
                  provider_message_id VARCHAR(128),
                  last_error VARCHAR(500),
                  created_at TIMESTAMPTZ NOT NULL,
                  completed_at TIMESTAMPTZ,
                  version BIGINT NOT NULL DEFAULT 0,
                  CONSTRAINT ck_delivery_channel CHECK (channel IN ('TELEGRAM', 'EMAIL')),
                  CONSTRAINT ck_delivery_status CHECK (status IN ('PENDING', 'PROCESSING', 'SENT', 'FAILED')),
                  CONSTRAINT uk_delivery_notification_channel UNIQUE (notification_id, channel)
              );
              CREATE INDEX idx_delivery_pending
                  ON delivery_attempts(status, next_attempt_at);

              CREATE TABLE scheduled_notifications (
                  id UUID PRIMARY KEY,
                  source_event_id UUID NOT NULL,
                  proposal_id UUID NOT NULL,
                  user_id UUID NOT NULL REFERENCES contact_projections(user_id),
                  reminder_type VARCHAR(16) NOT NULL,
                  scheduled_for TIMESTAMPTZ NOT NULL,
                  payload JSONB NOT NULL,
                  status VARCHAR(16) NOT NULL,
                  created_at TIMESTAMPTZ NOT NULL,
                  completed_at TIMESTAMPTZ,
                  version BIGINT NOT NULL DEFAULT 0,
                  CONSTRAINT ck_reminder_type CHECK (reminder_type IN ('HOURS_24', 'HOURS_2')),
                  CONSTRAINT ck_scheduled_status CHECK (status IN ('PENDING', 'CREATED', 'CANCELLED')),
                  CONSTRAINT uk_scheduled_proposal_user_type UNIQUE (proposal_id, user_id, reminder_type)
              );
              CREATE INDEX idx_scheduled_due
                  ON scheduled_notifications(status, scheduled_for);

              CREATE TABLE inbox_events (
                  event_id UUID PRIMARY KEY,
                  event_type VARCHAR(128) NOT NULL,
                  topic VARCHAR(128) NOT NULL,
                  received_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE failed_messages (
                  id UUID PRIMARY KEY,
                  event_id UUID,
                  topic VARCHAR(128) NOT NULL,
                  event_type VARCHAR(128),
                  payload TEXT NOT NULL,
                  error_message VARCHAR(1000) NOT NULL,
                  failed_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE telegram_updates (
                  update_id BIGINT PRIMARY KEY,
                  chat_id BIGINT NOT NULL,
                  reply_text VARCHAR(1000) NOT NULL,
                  processed_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE outbox_events (
                  id UUID PRIMARY KEY,
                  topic VARCHAR(128) NOT NULL,
                  event_key VARCHAR(128) NOT NULL,
                  event_type VARCHAR(128) NOT NULL,
                  payload TEXT NOT NULL,
                  created_at TIMESTAMPTZ NOT NULL,
                  published_at TIMESTAMPTZ,
                  attempts INTEGER NOT NULL DEFAULT 0,
                  next_attempt_at TIMESTAMPTZ NOT NULL,
                  last_error VARCHAR(500),
                  version BIGINT NOT NULL DEFAULT 0
              );
              CREATE INDEX idx_notification_outbox_pending
                  ON outbox_events(published_at, next_attempt_at);
