name: dating-local

services:
  identity-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: owoke_identity
      POSTGRES_USER: owoke_identity
      POSTGRES_PASSWORD: owoke_identity
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owoke_identity -d owoke_identity"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data

  dating-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: owoke_dating
      POSTGRES_USER: owoke_dating
      POSTGRES_PASSWORD: owoke_dating
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owoke_dating -d owoke_dating"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dating-postgres-data:/var/lib/postgresql/data

  notification-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: owoke_notification
      POSTGRES_USER: owoke_notification
      POSTGRES_PASSWORD: owoke_notification
    ports:
      - "127.0.0.1:15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owoke_notification -d owoke_notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

  places-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: owoke_places
      POSTGRES_USER: owoke_places
      POSTGRES_PASSWORD: owoke_places
    ports:
      - "127.0.0.1:15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owoke_places -d owoke_places"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - places-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dating-redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "dating-redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka-native:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data

  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

volumes:
  identity-postgres-data:
  dating-postgres-data:
  notification-postgres-data:
  places-postgres-data:
  redis-data:
  kafka-data:
  mailpit-data:
