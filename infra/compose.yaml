name: dating-local

services:
  core-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dating_core
      POSTGRES_USER: dating_core
      POSTGRES_PASSWORD: dating_core
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_core -d dating_core"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - core-postgres-data:/var/lib/postgresql/data

  notification-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dating_notification
      POSTGRES_USER: dating_notification
      POSTGRES_PASSWORD: dating_notification
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_notification -d dating_notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dating-redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "dating-redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka-native:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  core-postgres-data:
  notification-postgres-data:
  redis-data:
  kafka-data:
