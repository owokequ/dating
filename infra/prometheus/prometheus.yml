global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api-gateway:8080"] }]
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["identity-service:8081"] }]
  - job_name: dating-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["dating-service:8082"] }]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["notification-service:8083"] }]
  - job_name: places-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["places-service:8084"] }]
  - job_name: media-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["media-service:8085"] }]
  - job_name: events-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["events-service:8086"] }]
